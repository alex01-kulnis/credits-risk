[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credits-risk"
version = "0.1.0"
description = "CatBoost credit scoring with a prepared Home Credit dataset"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "pyarrow>=18", "numpy>=1.26", "catboost>=1.2", "scikit-learn>=1.5", "mlflow>=2.17"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
